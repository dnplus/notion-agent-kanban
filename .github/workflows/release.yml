name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: kbctl-aarch64-apple-darwin
            exe: kbctl
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: kbctl-x86_64-apple-darwin
            exe: kbctl
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: kbctl-x86_64-unknown-linux-gnu
            exe: kbctl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: kbctl-x86_64-pc-windows-msvc.exe
            exe: kbctl.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
